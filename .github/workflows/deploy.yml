# Publica o site (pasta Site/) no GitHub Pages a cada push na main.
# Requer: Settings > Pages > Source = "GitHub Actions".
# BASE_PATH (caminho do site no endereço):
#   - repositório "<nome>.github.io" (ex.: miridoces/miridoces.github.io) → "/" (raiz)
#   - qualquer outro repositório → "/<nome-do-repo>/"
#   - para forçar outro valor (ex.: domínio próprio), crie a variável de repositório BASE_PATH
#     em Settings > Secrets and variables > Actions > Variables.
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: Site/.nvmrc
          cache: npm
          cache-dependency-path: Site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          BASE_PATH: ${{ vars.BASE_PATH || (endsWith(github.event.repository.name, '.github.io') && '/' || format('/{0}/', github.event.repository.name)) }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: Site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
